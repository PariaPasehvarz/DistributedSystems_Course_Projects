version: "3.9"

networks:
  kv-net:
    driver: bridge

services:
  replica1:
    build:
      context: ./replica
    container_name: replica1
    networks:
      - kv-net
    ports:
      - "8080:8080"
    volumes:
      - ./configs/replica1.json:/app/config.json:ro
    command: ["-config", "/app/config.json"]

  replica2:
    build:
      context: ./replica
    container_name: replica2
    networks:
      - kv-net
    ports:
      - "8081:8081"
    volumes:
      - ./configs/replica2.json:/app/config.json:ro
    command: ["-config", "/app/config.json"]

  replica3:
    build:
      context: ./replica
    container_name: replica3
    networks:
      - kv-net
    ports:
      - "8082:8082"
    volumes:
      - ./configs/replica3.json:/app/config.json:ro
    command: ["-config", "/app/config.json"]
